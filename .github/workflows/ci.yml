name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync and test
        run: |
          uv sync --extra dev
          uv run pytest -q
      - name: Dist smoke
        run: |
          test -f frontend/dist/index.html
          uv run python -c "from lit.app import frontend_dist; p=frontend_dist(); assert (p/'index.html').exists(), p"

  # msvcrt byte lock. POSIX-only tests in these files skip themselves on win32.
  lock-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync and test the data lock
        run: |
          uv sync --extra dev
          uv run pytest -q tests/test_locking.py tests/test_server_lifetime.py
